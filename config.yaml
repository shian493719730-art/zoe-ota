# ---- 对比打分：四个维度的权重（只比较“所有活动都有数据”的指标）----
scoring_weights:
  reach: 0.35         # 触达：媒体/社媒曝光、播放量、现场观众
  quality: 0.25       # 质量：报道篇数、覆盖国家、重点媒体、奖项、“首次”事件
  engagement: 0.20    # 互动：粉丝净增、互动量
  conversion: 0.20    # 转化：线索、有效线索、签约伙伴

