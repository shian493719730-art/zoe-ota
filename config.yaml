# ============ 可编辑配置 ============
llm:
  provider: openai_compat      # 默认适配多模型网关；若用 Claude 官方请改为 anthropic
  model: claude-opus-5-5     # 客户最聪明、最高档位的 Claude Opus 5.5 旗舰模型
  smart_model: claude-opus-5-5
  fast_model: claude-3-5-haiku
  base_url: ""
  max_tokens: 4000
  temperature: 0.2

limits:
  max_llm_calls_per_run: 120   # 单次运行最多调用大模型次数，防止额度失控
  cache_hours: 12              # 搜索/网页缓存时长，重复运行不重复花钱

search:
  provider: ddg                # 会被 .env 里的 SEARCH_PROVIDER 覆盖
  results_per_query: 8

privacy:
  redact_pii: true             # 线索表发给大模型前，自动去掉姓名/邮箱/电话

brand:
  names: ["AGIBOT", "智元机器人", "智元", "AgiBot"]
  products: ["A3", "X2", "G2", "D1", "Luka"]

# ---- 重点媒体清单：监测时逐家检索，并在报告里单独列出“命中/未检索到” ----
