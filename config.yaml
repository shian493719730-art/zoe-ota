  - {name: Reuters,          domain: reuters.com,         region: overseas}
  - {name: Bloomberg,        domain: bloomberg.com,       region: overseas}
  - {name: Financial Times,  domain: ft.com,              region: overseas}
  - {name: CNBC,             domain: cnbc.com,            region: overseas}
  - {name: TechCrunch,       domain: techcrunch.com,      region: overseas}
  - {name: The Robot Report, domain: therobotreport.com,  region: overseas}
  - {name: 新华网,            domain: news.cn,             region: CN}
