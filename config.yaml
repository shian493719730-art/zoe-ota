# ---- 线索人群划分的分类体系 ----
lead_segments:
  - 渠道伙伴（经销商/VAD/代理）
  - 系统集成商
  - 终端企业-制造与工业
  - 终端企业-物流零售酒店等服务业
  - 教育与科研（高校/研究院/培训）
  - 政府与公共机构
  - 投资与咨询机构
  - 媒体与KOL
  - 同业/竞品
  - 个人/其他

# ---- 周报：活动闭环的七个阶段（可改）----
weekly:
  stages:
    - 立项与预算
    - 采购/合同/付款
    - 物料与物流
    - 现场执行
    - 传播发布
    - 复盘归档
    - 沉淀复用
    - 持续运营
